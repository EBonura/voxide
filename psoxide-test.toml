# VoXide's test description for psoxide-test (the SDK's harness, tools/psoxide-test).
# It declares what to build and check; the harness decides how. Baseline: psoxide-test.baseline.toml.
schema = 1
name = "VoXide"
repository = "EBonura/voxide"

# The shipping disc (what the library gets): sample profile applied, no state receipts. `make disc`
# is not used: it also installs into the user's game library.
[[build]]
name = "ship"
out = "build/ship"
commands = [
  ["make", "ship-order", "ORDER_OUT={out}"],
  ["make", "compile"],
  ["make", "pack", "PACK_OUT={out}/voxide.bin"],
]
collect = { "voxide.exe" = "game/target/mipsel-sony-psx/release/voxide.exe", "link.map" = "game/target/mipsel-sony-psx/psoxide-pgo-maps/*" }
disc = "voxide.cue"
map = "link.map"
# The ordering file the ship link followed (`make ship-order`), with its .placed sidecar beside it.
order = "voxide.order"
layout_files = ["pgo/voxide.layout"]

# The journeys' disc: the shipping code plus the result receipts, packed with --diag; the state blocks
# are located in its exe (gate-symbols.txt).
[[build]]
name = "gate"
out = "build/gate"
commands = [["make", "gate-disc", "PGO_VARIANT=hot=500", "GATE_DIR={out}", "GATE_SYMBOLS={out}/gate-symbols.txt"]]
collect = { "voxide.exe" = "game/target/mipsel-sony-psx/release/voxide.exe", "link.map" = "game/target/mipsel-sony-psx/psoxide-pgo-maps/*" }
disc = "voxide.cue"
map = "link.map"

# The lab discs (make gate-labs), built with the sample profile and no placement layout, and with no
# splash (game/src/main.rs show_intro): an unprofiled lab image does not fit the 2 MB with the core.
[[build]]
name = "gate-blocks"
out = "build/gate-blocks"
commands = [["make", "gate-disc", "FEATURES=block-lab", "PGO_VARIANT=hot=500", "GATE_DIR={out}", "GATE_SYMBOLS={out}/gate-symbols.txt"]]
collect = { "voxide.exe" = "game/target/mipsel-sony-psx/release/voxide.exe", "link.map" = "game/target/mipsel-sony-psx/psoxide-pgo-maps/*" }
disc = "voxide.cue"
map = "link.map"

[[build]]
name = "gate-lab"
out = "build/gate-lab"
commands = [["make", "gate-disc", "FEATURES=music-lab", "PGO_VARIANT=hot=500", "GATE_DIR={out}", "GATE_SYMBOLS={out}/gate-symbols.txt"]]
collect = { "voxide.exe" = "game/target/mipsel-sony-psx/release/voxide.exe", "link.map" = "game/target/mipsel-sony-psx/psoxide-pgo-maps/*" }
disc = "voxide.cue"
map = "link.map"

[[build]]
name = "gate-pull"
out = "build/gate-pull"
commands = [["make", "gate-disc", "FEATURES=save-pull", "PGO_VARIANT=hot=500", "GATE_DIR={out}", "GATE_SYMBOLS={out}/gate-symbols.txt"]]
collect = { "voxide.exe" = "game/target/mipsel-sony-psx/release/voxide.exe", "link.map" = "game/target/mipsel-sony-psx/psoxide-pgo-maps/*" }
disc = "voxide.cue"
map = "link.map"

# The torch lab (src/torchlab.rs): the three scenes of torch light stopped by walls. Never shipped.
[[build]]
name = "gate-torches"
out = "build/gate-torches"
commands = [["make", "gate-disc", "FEATURES=torch-lab", "PGO_VARIANT=hot=500", "GATE_DIR={out}", "GATE_SYMBOLS={out}/gate-symbols.txt"]]
collect = { "voxide.exe" = "game/target/mipsel-sony-psx/release/voxide.exe", "link.map" = "game/target/mipsel-sony-psx/psoxide-pgo-maps/*" }
disc = "voxide.cue"
map = "link.map"

# What block light cost, measured 2026-11-20 on the SDK fce1f6855bc1 pin against the b394b08
# baseline (text 677,372 B, free RAM 102,732 B), after the shrink (four shade rows in the colour
# table instead of six, table build and torch collection out of line, the mask build reading the
# tier flag once a plane, profile re-collected): text +10,364 B, free RAM -18,528 B (what text,
# data and bss take is what is left of the 2 MB, so the free figure is the sum). Before the shrink
# it was text +14,388 B and free -28,128 B. The bytes bought (game/src/light.rs):
#   bss  colour table 16 light levels x 2 materials x 4 shades x 16 bands x 4 B = 8,192 B (was 3,072:
#        a face shows the brighter of its sky bucket and its torch tier), tier maps of the chunk
#        being meshed 6,144 B (were 2,048), the torch list of 32 = 384 B
#   text the flood and the tier lookup, the torch list with the nearest-to-the-player cap and the
#        neighbouring chunks' torches, the colour-table build for the extra levels, the neighbour
#        remesh when a torch comes or goes
# The size stage passed against that baseline with bars of 11,000 B of text and 19,500 B of free RAM;
# the baseline is blessed on this code (the commit that carries this comment), so a change is judged
# against block light's own size from here on and the bars are 0 again.
# What torch light stopped by walls (game/src/light.rs, game/src/world/torchlight.rs) costs, measured
# 2026-11-20 against the baseline blessed on block light as it was (text 687,736 B, data 95,032 B,
# bss 1,131,604 B, free RAM 84,204 B), sample profile re-collected on the final code: text +3,044 B,
# data +1,792 B, bss +8,416 B, free RAM -13,248 B (text, data and bss are what is left of the 2 MB, so
# the free figure is their sum). The bytes buy:
#   bss  the kept lights of 32 torches, 32 x 212 B = 6,784 B (the three tiers as columns of bits, about
#        200 B, and the torch's place), the tier maps 7,776 B (were 6,144: a ring of columns round the
#        chunk, because a face takes the light of the cell in front of it)
#   text the flood (a step is a few operations a column of heights, three, six and nine steps kept), the
#        read-back into a chunk's tier maps, the table of lights and the marks a block change leaves on
#        it, the lab-free hooks in `set`, `raw_set`, the blast and the chunk load
#   data constants of the flood
# The flood works in the first 3.5 KB of MESH_FACES (empty while a mesh sets its lighting up), which
# keeps another 3.5 KB of bss out of this figure. The size stage passed with bars of 3,500 B of text
# and 14,000 B of free RAM; the baseline is blessed on this code (the commit that carries this
# comment), so the bars are 0 again.
[[size]]
build = "ship"

# The two tapes of the sample profile: train (the profile's own route) and unseen (the holdout, a
# different walk on the sticks). Polls 252..1200 are gameplay on both.
#
# Blessed 2026-11-20 on the block-light code. The speed of the code is judged in lockstep (one
# simulation step per pad poll, so both builds are in the same game state at every poll, the sample
# profile's `lockstep` build); frame work per frame, main against block light, each with its own
# sample profile:
#   train   854,827 against 856,197 (+1,370, +0.16%)     unseen   681,086 against 679,855 (-1,231, -0.18%)
# The two tapes add up equal. The train difference is mostly instruction-cache refill stalls (60.75
# million against 60.67 million cycles of them, from where the profile put the code) and +0.14% of
# instructions. Without torches the added code costs a flag read a plane in the mask build and a
# compare in the close-range shell. The normal-pacing figures of this baseline move with the tape's trajectory
# (the poll-bound tape plays the same pad presses against a game that is a few cycles slower or
# faster, and its frames cross a vblank at other polls) and with which profile layout was collected:
# train 887,283 against 887,119 at offset 0 for the repin baseline, unseen 694,693 against 727,463,
# with the code no slower in lockstep. A speed gate on lockstep builds would judge the code and not
# the trajectory (proposed to the harness owners in the lane notes).
#
# Re-blessed 2026-11-20 on torch light stopped by walls. Lockstep, no torch in the world (frame work
# per frame, each build with its own sample profile): block light before it 856,197 (train) and
# 679,855 (unseen), after it 858,042 and 683,897 (+0.22%, +0.59%); main for reference 854,827 and
# 681,086. The code that runs without a torch is a flag read in the stream tick and in the block
# edit hooks; the instruction count differs by +0.7%, which the sample profile's own collection
# (2,007,589 samples against 2,010,472) does not show, so the lockstep difference is not isolated
# to a function. In normal pacing the unseen tape read 740,754 against 694,510 before the bless
# (the tape's trajectory, as for the block-light bless), train 888,900 against 886,785. Torches
# themselves cost: a flood about 100,000 cycles, one a frame, and about 19,000 cycles a torch each
# time a chunk with it in reach is meshed (LIMITS.md).
[[speed]]
name = "train"
build = "ship"
tape = "pgo/train.pxtape"
polls = [252, 1200]
offsets = [-48, -36, -24, -12, 0, 12, 24, 36]
launch_args = ["--embedded-playtest"]

[[speed]]
name = "unseen"
build = "ship"
tape = "pgo/unseen.pxtape"
polls = [252, 1200]
offsets = [-48, -36, -24, -12, 0, 12, 24, 36]
launch_args = ["--embedded-playtest"]

[journeys]
files = "tests/*.toml"
precheck = ["smoke-boot-play", "settings-title-ui"]

[cross]
smoke = ["tests/smoke-boot-play.toml"]
# The shipping disc has no state blocks: it must boot and present with no input on every emulator.
boot = { build = "ship", frames = 3000 }

[[host]]
name = "no64"
command = ["make", "no64"]

# Load-delay hazards in guest asm (fleet rule since SDK 580daa02), with the pin's own scanner.
[[host]]
name = "check-mfc0"
command = ["cargo", "run", "-q", "--release", "--locked", "--manifest-path", ".psoxide/tools/psoxide-hazard/Cargo.toml", "--bin", "check-mfc0", "--", "game"]

# Every host test target except fire_blast, which fails on main (its rustc harness does not link
# psx_math): left out by name until the owner fixes it, not skipped silently.
[[host]]
name = "host-tests"
command = ["cargo", "test", "-q", "--no-fail-fast", "--manifest-path", "tools/host-tests/Cargo.toml", "--test", "adpcm_error", "--test", "blast_capacity", "--test", "blocks", "--test", "fluid_ignite", "--test", "full_card", "--test", "hand", "--test", "light", "--test", "mask_equiv", "--test", "menu_tree", "--test", "music_plan", "--test", "near_grid", "--test", "sapper_capacity", "--test", "seal", "--test", "settings_card", "--test", "settings_profile", "--test", "shared_clip", "--test", "tnt_capacity", "--test", "tnt_pending", "--test", "units"]

[[host]]
name = "voxide-tools"
command = ["cargo", "test", "-q", "--manifest-path", "tools/voxide-tools/Cargo.toml"]

[clean]
build = "ship"
seed = [".psoxide"]
compare = ["voxide.bin", "voxide.cue", "voxide.exe"]

[[install]]
build = "ship"
name = "VoXide"
