# Build this crate for the PlayStation 1 by default, so a plain
# `cargo build --release` produces a PSX-EXE.
[build]
target = "mipsel-sony-psx"
# Relative to game/, so the image stays at game/target/... now that the
# workspace root is the repo root.
target-dir = "target"

[unstable]
# No prebuilt std for the PSX target: compile core ourselves.
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]

[target.mipsel-sony-psx]
# LLVM's MIPS delay-slot filler only searches backwards by default, which
# leaves a nop behind most branches and calls. Searching the successor block
# and forward fills most of them; hazard_patch.py (run by every Makefile build)
# still reroutes each load-delay hazard the filler creates, and hazard_scan.py
# proves the image clean. Same flags as hl-psx. An exported RUSTFLAGS replaces
# this list, so a caller that sets one has to carry both flags itself;
# `--config target.mipsel-sony-psx.rustflags=[...]` appends to it.
rustflags = [
    "-Cllvm-args=-disable-mips-df-succbb-search=false",
    "-Cllvm-args=-disable-mips-df-forward-search=false",
]

# LLVM's MIPS delay-slot filler hoists loads into branch delay slots without
# re-checking the R3000 load-delay hazard. This used to be held off with
# `-C llvm-args=-disable-mips-df-backward-search`, which left a nop in nearly
# every delay slot of the image. The filler now runs and the Makefile reroutes
# the hazards it creates through PSoXide's post-link trampoline patcher
# (`$(PSOXIDE)/tools/hazard_patch.py`, HAZARD_TRAMPOLINES in psx-rt), as
# Cortex, hl-psx and quake-psx build.
