[package]
name    = "voxide"
version = "0.3.2"
edition = "2021"

[[bin]]
name = "voxide"
path = "src/main.rs"

[features]
default = []
# PSoXide-only MMIO telemetry so `frontend launch` can stop on guest frames and
# write profile/counter CSVs. Off for shipping builds (calls compile to no-ops).
emulator-telemetry = ["psx-telemetry/emit"]
# One sim step per pad poll instead of one per elapsed vblank. For comparing
# builds of different speed (PGO, layout changes) state for state; never ship.
lockstep = []
# Headless UI captures only (src/fixture.rs): a stocked inventory and SELECT
# to build a table/chest/furnace at the crosshair. Never ship.
ui-fixture = []
# Headless portal captures only (src/fixture.rs): SELECT builds two lit
# portals (nether on X, void on Z) by the spawn and then steps through a fixed set
# of views of them. Never ship.
portal-views = ["ui-fixture"]
# Headless crosshair measurements only (src/picklab.rs): a pig pinned in front
# of a held view, and PICK_LAB to watch what the pick and the attack reach.
# Never ship.
pick-lab = []
# Headless turn-rate measurements only: publishes the view angles (LOOK_LAB in
# src/picklab.rs) for a stick tape to read. Never ship.
look-lab = []
# Headless tool measurements only (src/toollab.rs): the break time and weapon
# damage tables, and ore trials per pickaxe tier. Never ship.
tool-lab = []
# The four ore trials worth filming (tool-lab only).
lab-demo = ["tool-lab"]
# Mesh arena stress: a small arena so compaction runs constantly, plus an
# invariant check after every allocation. Never ship.
ram-stress = []
# Block store stress: a block arena just above the routes' use, so regions
# fragment and compaction runs. Never ship.
ram-stress-blk = []
# Headless mob-behaviour measurements only (mob.rs LAB): a fixed cast of mobs
# around the player at the first update, forced night, and mob damage counted
# instead of dealt. Never ship.
mob-lab = []
# Headless tuning measurements only (src/tunelab.rs): a scripted arena and
# timeline of movement and survival scenarios. Never ship.
tune-lab = []
# Headless save tests only (main.rs world_lighting): publishes the world
# clock as VOXIDE_LAB_DAY and moves the respawn point 7 blocks east and 5
# north of the world spawn once, as sleeping in a bed would. Never ship.
save-lab = []
# save-lab plus a pulled card: the first save stops after its third card
# frame as if the card were removed there. Never ship.
save-pull = ["save-lab"]
# Headless fire and TNT captures and frame gates only (src/firelab.rs): a
# scripted arena of single TNT, a chain, a big cube, fire beside TNT, a
# burning hut and lava beside TNT. Never ship.
fire-lab = []
# Headless storm captures and gates only (weather.rs): a full thunderstorm
# from the first tick and a bolt 12 blocks ahead every 4 s. Never ship.
storm-lab = []
# storm-lab without the scripted bolts: the storm at Java's natural strike
# rate, for the frame-time gates. Never ship.
storm-calm = ["storm-lab"]
# storm-calm, then the player moved to the nearest desert (storm-desert)
# or snowy column (storm-snow) at the first tick, flying. Never ship.
storm-desert = ["storm-calm"]
storm-snow = ["storm-calm"]

[dependencies]
psx-telemetry = { path = "../.psoxide/sdk/crates/psx-telemetry" }
psx-rt   = { path = "../.psoxide/sdk/crates/psx-rt", features = ["hazard-trampolines-256"] }
psx-sfx  = { path = "../.psoxide/sdk/crates/psx-sfx" }
psx-gpu  = { path = "../.psoxide/sdk/crates/psx-gpu" }
psx-io   = { path = "../.psoxide/sdk/crates/psx-io" }
psx-pad  = { path = "../.psoxide/sdk/crates/psx-pad" }
psx-tick = { path = "../.psoxide/sdk/crates/psx-tick" }
psx-font = { path = "../.psoxide/sdk/crates/psx-font" }
psx-vram = { path = "../.psoxide/sdk/crates/psx-vram" }
psx-math = { path = "../.psoxide/sdk/crates/psx-math" }
psx-gte  = { path = "../.psoxide/sdk/crates/psx-gte" }
psx-spu  = { path = "../.psoxide/sdk/crates/psx-spu" }
psx-pack = { path = "../.psoxide/sdk/crates/psx-pack" }
psx-mc   = { path = "../.psoxide/sdk/crates/psx-mc" }
psx-settings = { path = "../.psoxide/sdk/crates/psx-settings" }
psx-fx   = { path = "../.psoxide/sdk/crates/psx-fx" }
