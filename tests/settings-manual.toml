name = "voxide-settings-manual"
title = "VoXide: settings exits and controls introduction never autosave"
disc = ["build/gate/voxide.cue"]
symbols = ["build/gate-symbols.txt"]
memcard = "fresh"
max_ticks = 9000

[[step]]
wait_until = { kind = "ram", sym = "VOXIDE_SETTINGS_STATE", offset = 12, op = "eq", value = 1 }
timeout = 1800
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 28
op = "eq"
value = 18

# PLAY -> CREDIT -> SETTINGS by wrapping upward twice: the OPTIONS page. STICK
# SETTINGS is two rows down; MOVE DEADZONE is three below its first row.
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["right"]
hold = 4
wait = 12
[[step]]
checkpoint = "settings-unsaved"
golden = false
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 28
op = "eq"
value = 20
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 20
op = "eq"
value = 1
[[step.assert]]
kind = "card_unchanged"
[[step]]
press = ["circle"]
hold = 4
wait = 12
[[step]]
press = ["circle"]
hold = 4
wait = 12
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 12
op = "eq"
value = 1
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
press = ["start"]
hold = 4
wait = 12
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 12
op = "eq"
value = 1

# The CONTROLS row opens the card and O closes it, writing nothing; PLAY GAME
# then goes straight into the world, with no card of its own.
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["cross"]
hold = 4
wait = 30
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 12
op = "eq"
value = 3
[[step.assert]]
kind = "card_unchanged"
[[step]]
press = ["circle"]
hold = 4
wait = 12
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 12
op = "eq"
value = 1
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 20
op = "eq"
value = 1
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["cross"]
hold = 4
wait = 60
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 12
op = "zero"
[[step]]
checkpoint = "play-skips-the-controls-card"
golden = false
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 12
op = "zero"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 20
op = "eq"
value = 1
[[step]]
press = ["start"]
hold = 4
wait = 12
[[step]]
press = ["circle"]
hold = 4
wait = 12
[[step.assert]]
kind = "card_unchanged"
[[step]]
press = ["start"]
hold = 4
wait = 12
[[step]]
press = ["start"]
hold = 4
wait = 12
[[step.assert]]
kind = "card_unchanged"

# GAME MENU, OPTIONS..., then up through DONE to SAVE SETTINGS.
[[step]]
press = ["start"]
hold = 4
wait = 12
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
checkpoint = "options-save-selected"
golden = false
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 16
op = "eq"
value = 4
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 36
op = "eq"
value = 1
[[step.assert]]
kind = "card_unchanged"
# Cancel must suppress Cross on the actual paused Save Settings row: O takes
# the press up to GAME MENU and nothing is written.
[[step]]
press = ["circle", "cross"]
hold = 4
wait = 12
[[step]]
checkpoint = "options-cancel-and-confirm-no-write"
golden = false
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 12
op = "eq"
value = 4
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 36
op = "zero"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 20
op = "eq"
value = 1
# GAME MENU remembered OPTIONS... and OPTIONS remembered SAVE SETTINGS. X, X saves.
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 36
op = "eq"
value = 1
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 16
op = "eq"
value = 4
[[step]]
press = ["cross"]
hold = 4
wait = 100
[[step]]
checkpoint = "explicit-settings-save"
golden = false
[[step.assert]]
kind = "card_writes"
min_count = 1
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 24
op = "eq"
value = 1
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 20
op = "zero"
[[step]]
card = { action = "snapshot" }
[[step]]
card = { action = "reboot" }
[[step]]
wait = 60
[[step]]
wait_until = { kind = "ram", sym = "VOXIDE_SETTINGS_STATE", offset = 12, op = "eq", value = 1 }
timeout = 1800
[[step]]
checkpoint = "saved-profile-loaded"
golden = false
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 28
op = "eq"
value = 20
[[step]]
card = { action = "snapshot" }
# Compare this receipt with the pre-reboot Save receipt. The gate's
# card_unchanged reference stays the original fresh card across reboots.

# The title settings card has its own explicit Save action.
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["right"]
hold = 4
wait = 12
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 28
op = "eq"
value = 22
[[step]]
press = ["circle"]
hold = 4
wait = 12
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
checkpoint = "title-save-selected"
golden = false
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 16
op = "eq"
value = 4
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 36
op = "eq"
value = 1
[[step]]
press = ["cross"]
hold = 4
wait = 100
[[step]]
checkpoint = "title-explicit-save"
golden = false
[[step.assert]]
kind = "card_writes"
min_count = 1
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 24
op = "eq"
value = 1
[[step]]
card = { action = "snapshot" }
[[step]]
card = { action = "reboot" }
[[step]]
wait = 60
[[step]]
wait_until = { kind = "ram", sym = "VOXIDE_SETTINGS_STATE", offset = 12, op = "eq", value = 1 }
timeout = 1800
[[step]]
checkpoint = "title-save-loaded"
golden = false
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 28
op = "eq"
value = 22
[[step]]
card = { action = "snapshot" }
