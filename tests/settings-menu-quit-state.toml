# What a world leaves behind must not follow the player through SAVE AND QUIT TO
# TITLE: a world is dirtied (flight, god mode, coordinates, a full kit, noon,
# thunder, a spawned pig, a placed block, the world's music playing), the player quits to
# the title, and the world PLAY starts has a cold boot's inventory, clock, mobs, weather,
# flags and sim tick, with the title's and the world's music rules running again.
# VOXIDE_SETTINGS_STATE offsets 44.. are the world summary (game/src/main.rs
# `publish_settings`), refreshed while the pause menu is open.
name = "voxide-settings-menu-quit-state"
title = "VoXide: a new world after SAVE AND QUIT carries nothing of the old one"
disc = ["build/gate/voxide.cue"]
symbols = ["build/gate-symbols.txt"]
memcard = "fresh"
max_ticks = 14000

[[step]]
wait_until = { kind = "ram", sym = "VOXIDE_SETTINGS_STATE", offset = 12, op = "eq", value = 1 }
timeout = 1800
[[step]]
wait = 120
[[step]]
label = "PLAY GAME: straight into the world"
press = ["cross"]
hold = 4
wait = 150
[[step]]
wait = 60
[[step]]
press = ["start"]
hold = 4
wait = 12
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 12
op = "eq"
value = 4
[[step]]
checkpoint = "cold-boot-world"
golden = false
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 44
op = "eq"
value = 32
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 48
op = "eq"
value = 2
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 52
op = "eq"
value = 4
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 56
op = "lt"
value = 1000
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 60
op = "zero"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 64
op = "zero"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 68
op = "zero"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 72
op = "zero"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 76
op = "lt"
value = 600
[[step]]
press = ["start"]
hold = 4
wait = 12
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 12
op = "zero"
