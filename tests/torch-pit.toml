# A torch in a sealed pit does not light the ground round it, and lights it through a hole. Built with
#
#   make gate-disc FEATURES=torch-lab PGO_VARIANT=off GATE_DIR=$PWD/build/gate-torches GATE_SYMBOLS=$PWD/build/gate-torches/gate-symbols.txt
#   psoxide-gate run tests/torch-pit.toml --disc build/gate-torches/voxide.cue --no-hw
#
# SELECT does the next thing of the torch lab (src/torchlab.rs): the first builds a chamber under the
# stone floor at midnight and stands the player beside it, the next puts a torch in the chamber with
# the edit a player's torch makes, the next takes away one block of the stone over it. VOXIDE_GATE_STATE
# word 4 (offset 16) is the stage done times two, plus one when the meshes and the torch light have
# caught up, so every wait here is on the game's own state. Java stops light at solid blocks: the frame
# after the torch must be the frame before it, and the frame after the hole must not.
name = "voxide-torch-pit"
title = "VoXide: a torch in a sealed pit leaves the ground dark, and lights it through a hole"
disc = ["build/gate-torches/voxide.cue"]
symbols = ["build/gate-torches/gate-symbols.txt"]
pad = "dualshock"
max_ticks = 6000

[card_fixture]
path = "tests/cards/legacy-controls-seen.mcd"
sha256 = "a0bc97a529dc33cdda8c438ec8e06a5ebc19e119fad846128d8827131c4a2f08"

[[step]]
label = "the title appears over the generated world"
wait_until = { kind = "ram", sym = "VOXIDE_SETTINGS_STATE", offset = 12, op = "eq", value = 1 }
timeout = 3000

[[step]]
label = "PLAY GAME goes directly to the world"
press = ["cross"]
hold_until = { kind = "ram", sym = "VOXIDE_SETTINGS_STATE", offset = 12, op = "eq", value = 0 }
timeout = 1500

[[step]]
label = "the world clock runs"
wait_until = { kind = "ram", sym = "VOXIDE_GATE_STATE", offset = 12, op = "ge", value = 120 }
timeout = 1500

[[step]]
label = "SELECT builds the chamber under the floor at midnight and stands beside it"
press = ["select"]
sync = "poll"
hold = 3
wait = 2

[[step]]
wait_until = { kind = "ram", sym = "VOXIDE_GATE_STATE", offset = 16, op = "eq", value = 3 }
timeout = 3000

[[step]]
sync = "poll"
wait = 20

[[step]]
checkpoint = "pit-before"
golden = false
[[step.assert]]
kind = "not_flat"

[[step]]
label = "SELECT puts a torch in the chamber"
press = ["select"]
sync = "poll"
hold = 3
wait = 2

[[step]]
wait_until = { kind = "ram", sym = "VOXIDE_GATE_STATE", offset = 16, op = "eq", value = 5 }
timeout = 3000

[[step]]
sync = "poll"
wait = 20

[[step]]
checkpoint = "pit-sealed"
golden = false
[[step.assert]]
kind = "frame_diff"
from = "pit-before"
region = { x = 0, y = 90, w = 320, h = 110 }
color_tol = 12
max_changed = 0.01
note = "sealed: the ground round the chamber stays as dark as it was"

[[step]]
label = "SELECT takes the middle block of the cover away"
press = ["select"]
sync = "poll"
hold = 3
wait = 2

[[step]]
wait_until = { kind = "ram", sym = "VOXIDE_GATE_STATE", offset = 16, op = "eq", value = 7 }
timeout = 3000

[[step]]
sync = "poll"
wait = 20

[[step]]
checkpoint = "pit-open"
golden = false
[[step.assert]]
kind = "frame_diff"
from = "pit-before"
region = { x = 0, y = 90, w = 320, h = 110 }
color_tol = 12
min_changed = 0.05
note = "open: the light comes out of the hole and lights the ground round it"
