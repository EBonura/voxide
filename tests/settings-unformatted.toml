# SAVE SETTINGS on an unformatted card asks first, like the world save: the first
# press leaves the card untouched and reports a blank card, the second formats
# it and saves.
name = "voxide-settings-unformatted"
title = "VoXide: an unformatted settings card is formatted only when Save is pressed twice"
disc = ["build/gate/voxide.cue"]
symbols = ["build/gate-symbols.txt"]
memcard = "fresh"
max_ticks = 4000
[card_fixture]
path = "tests/fixtures/unformatted.mcd"
sha256 = "fa43239bcee7b97ca62f007cc68487560a39e19f74f3dde7486db3f98df8e471"

[[step]]
wait_until = { kind = "ram", sym = "VOXIDE_SETTINGS_STATE", offset = 12, op = "eq", value = 1 }
timeout = 1800
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 28
op = "eq"
value = 18
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
press = ["right"]
hold = 4
wait = 12
[[step]]
press = ["start"]
hold = 4
wait = 12
[[step]]
checkpoint = "unformatted-exit-no-write"
golden = false
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 12
op = "eq"
value = 1
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 20
op = "eq"
value = 1
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
checkpoint = "unformatted-save-selected"
golden = false
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 16
op = "eq"
value = 8
[[step]]
press = ["cross"]
hold = 4
wait = 120
[[step]]
checkpoint = "blank-card-asks-before-format"
golden = false
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 24
op = "eq"
value = 3
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 20
op = "eq"
value = 1
# Formatting writes the whole directory and the save follows, all in one call
# that holds the screen for several seconds, so wait for the result.
[[step]]
press = ["cross"]
hold = 4
wait = 40
[[step]]
checkpoint = "formatting-indicator-shown"
golden = false
[[step.assert]]
kind = "pixels"
color = [14, 14, 22]
color_tol = 4
min_count = 50000
note = "the FORMATTING screen, not a frozen menu, is on display while the card is written"
[[step]]
wait_until = { kind = "ram", sym = "VOXIDE_SETTINGS_STATE", offset = 24, op = "eq", value = 1 }
timeout = 1500
[[step]]
checkpoint = "second-press-formats-and-saves"
golden = false
[[step.assert]]
kind = "card_writes"
min_count = 1
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 24
op = "eq"
value = 1
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 20
op = "zero"
[[step]]
card = { action = "snapshot" }
[[step]]
card = { action = "reboot" }
[[step]]
wait = 60
[[step]]
wait_until = { kind = "ram", sym = "VOXIDE_SETTINGS_STATE", offset = 12, op = "eq", value = 1 }
timeout = 1800
[[step]]
checkpoint = "formatted-card-loads-saved-profile"
golden = false
[[step.assert]]
kind = "ram"
sym = "VOXIDE_SETTINGS_STATE"
offset = 28
op = "eq"
value = 20
