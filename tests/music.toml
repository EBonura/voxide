sym = "VOXIDE_MUSIC_STATE"
offset = 32
op = "eq"
value = 1
[[step.assert]]
kind = "ram"
sym = "VOXIDE_MUSIC_STATE"
offset = 36
op = "zero"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_MUSIC_STATE"
offset = 28
op = "le"
value = 300
[[step.assert]]
kind = "ram"
sym = "VOXIDE_MUSIC_STATE"
offset = 48
op = "eq"
value = 300
[[step.assert]]
kind = "ram"
sym = "VOXIDE_MUSIC_STATE"
offset = 20
op = "eq"
value = 1
[[step]]
wait_until = { kind = "ram", sym = "VOXIDE_MUSIC_STATE", offset = 12, op = "eq", value = 2 }
timeout = 600
[[step]]
