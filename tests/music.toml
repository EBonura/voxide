# VoXide music, on the shipping disc: the title screen's piece, the menu music
# stopping when the world loads, Java's starting delay, music through the pause
# menu, the MUSIC slider silencing it, and SAVE SETTINGS keeping the slider.
#
#   psoxide-gate run tests/music.toml --disc build/gate/voxide.cue --no-hw
#
# The receipt is VOXIDE_MUSIC_STATE (game/src/music.rs): phase at offset 12
# (waiting 1, playing 2), piece 16, what the last pick was for 20 (title 1,
# world 2), slider 24, vblanks to the next pick 28, pieces started 32, the drive
# has seen its head inside the file 36, milliseconds into the piece 40, refused
# starts 44, the last delay in vblanks 48, the drive mixer level 52. The `audio`
# asserts read the SPU output, which carries the CD input. Nobody listens to
# this journey: it proves the drive is streaming and the SPU output is not
# silent, not that the music sounds right.

name = "voxide-music"
title = "VoXide: music on the title, through a world, the slider and SAVE SETTINGS"
disc = ["build/gate/voxide.cue"]
symbols = ["build/gate-symbols.txt"]
memcard = "fresh"
max_ticks = 14000

[[step]]
wait_until = { kind = "ram", sym = "VOXIDE_MUSIC_STATE", offset = 12, op = "eq", value = 2 }
timeout = 3600
[[step]]
checkpoint = "title-piece-playing"
golden = false
[[step.assert]]
kind = "ram"
sym = "VOXIDE_MUSIC_STATE"
offset = 20
op = "eq"
value = 1
[[step.assert]]
kind = "ram"
sym = "VOXIDE_MUSIC_STATE"
offset = 32
op = "eq"
value = 1
[[step.assert]]
kind = "ram"
sym = "VOXIDE_MUSIC_STATE"
offset = 16
op = "lt"
value = 4
[[step.assert]]
kind = "ram"
sym = "VOXIDE_MUSIC_STATE"
offset = 44
op = "zero"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_MUSIC_STATE"
offset = 24
op = "eq"
value = 100
[[step.assert]]
kind = "ram"
sym = "VOXIDE_MUSIC_STATE"
offset = 52
op = "eq"
value = 64
[[step]]
wait_until = { kind = "ram", sym = "VOXIDE_MUSIC_STATE", offset = 36, op = "eq", value = 1 }
timeout = 400
[[step]]
wait = 400
checkpoint = "title-drive-streams"
golden = false
[[step.assert]]
kind = "audio"
window = 120
min_peak = 200
[[step.assert]]
kind = "ram"
sym = "VOXIDE_MUSIC_STATE"
offset = 40
op = "ge"
value = 500
[[step.assert]]
kind = "ram"
sym = "VOXIDE_MUSIC_STATE"
offset = 12
op = "eq"
value = 2
[[step]]
label = "PLAY; the first PLAY shows the CONTROLS card"
press = ["cross"]
hold = 4
wait = 60
[[step]]
label = "close the card: the world loads"
press = ["circle"]
hold = 4
wait = 20
[[step]]
