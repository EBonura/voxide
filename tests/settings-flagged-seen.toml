# Cold boot from the separate card snapshot written by the legacy migration
# journey. The settings file now has game flag bit 1 and difficulty 1.
name = "voxide"
title = "VoXide: migrated controls flag survives a cold boot"
disc = ["build/gate/voxide.cue"]
symbols = ["build/gate-symbols.txt"]
max_ticks = 3000

[card_fixture]
path = "tests/cards/flagged-controls-seen.mcd"
sha256 = "785dbad37d15e2523d8c2afdae55e89708e51103cf7fb8945c56b8d8b8048542"

[[step]]
label = "menu appears over the generated world"
wait_until = { kind = "pixels", color = [140, 140, 140], color_tol = 4, region = { x = 100, y = 204, w = 125, h = 22 }, min_count = 500 }
timeout = 1500

[[step]]
label = "PLAY GAME uses the migrated flag to skip the controls card"
press = ["cross"]
hold = 4

[[step]]
label = "normal world ticks after a cold boot"
wait_until = { kind = "ram", sym = "VOXIDE_GATE_STATE", offset = 12, op = "ge", value = 10 }
timeout = 800

[[step]]
checkpoint = "flagged-world"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "ram"
sym = "VOXIDE_GATE_STATE"
offset = 12
op = "ge"
value = 10
[[step.assert]]
kind = "card_unchanged"
note = "loading the migrated flag does not rewrite the card"

[[step]]
card = { action = "snapshot" }
